{{ define "main" }}
<article class="post-page">
  <div class="post-inner">
    <header class="post-header">
      <div class="post-meta">
        <span class="item-date">{{ .Date.Format "January 02, 2006" }}</span>
        {{ with .Params.platform }}<span class="card-platform {{ lower . }}">{{ . }}</span>{{ end }}
        {{ with .Params.difficulty }}<span class="card-difficulty {{ lower . }}">{{ . }}</span>{{ end }}
      </div>
      <h1 class="post-title">{{ .Title }}</h1>
      {{ with .Params.tags }}
      <div class="card-tags">
        {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
      </div>
      {{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
    <footer class="post-footer">
      <a href="/posts/" class="btn btn-outline">← Back to Writeups</a>
    </footer>
  </div>
</article>
{{ end }}
