<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav-logo">
      <span class="prompt">~</span>
      <span class="nav-title">{{ .Site.Title }}</span>
    </a>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}" class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
